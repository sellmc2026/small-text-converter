<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../favicon.png">

    <title>Unicodes | UtilitEase</title>

    <style>

        /* ========================================
           GENERAL PAGE
           ======================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color: #101010;
            color: #ffffff;

            font-family: Arial, sans-serif;
        }


        /* ========================================
           HEADER
           ======================================== */

        #header {
            text-align: center;

            padding-top: 30px;
            padding-bottom: 20px;
        }

        #logo {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }

        #title {
            margin-top: 10px;
            margin-bottom: 25px;

            font-size: 32px;
        }


        /* ========================================
           NAVIGATION
           ======================================== */

        #navigation {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 50px;

            padding-bottom: 20px;
        }

        .navButton {
            background: none;
            border: none;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .navButton:hover {
            color: #00ff00;
        }


        /* ========================================
           SEPARATOR
           ======================================== */

        #topLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           MAIN
           ======================================== */

        #main {
            min-height: 550px;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding-top: 40px;
            padding-bottom: 40px;

            box-sizing: border-box;
        }


        /* ========================================
           SEARCH
           ======================================== */

        #searchBox {
            width: 900px;
            max-width: 90%;

            box-sizing: border-box;

            padding: 14px;

            margin-bottom: 30px;

            font-size: 18px;

            background-color: #222222;
            color: #ffffff;

            border: 2px solid #555555;
            border-radius: 8px;

            outline: none;
        }

        #searchBox:focus {
            border-color: #ffffff;
        }


        /* ========================================
           UNICODE GRID
           ======================================== */

        #unicodeGrid {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            width: 900px;
            max-width: 90%;
        }


        /* ========================================
           UNICODE CARD
           ======================================== */

        .unicodeCard {
            display: flex;

            flex-direction: column;

            background-color: #1b1b1b;

            border: 2px solid #333333;

            border-radius: 8px;

            overflow: hidden;
        }


        /* ========================================
           UNICODE CHARACTER
           ======================================== */

        .unicodeCharacter {
            height: 100px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 50px;

            background-color: #222222;
        }


        /* ========================================
           COPY BUTTON
           ======================================== */

        .unicodeCopy {
            width: 100%;

            height: 40px;

            border: none;

            background-color: #444444;
            color: #ffffff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.2s ease;
        }

        .unicodeCopy:hover {
            background-color: #666666;
        }


        /* ========================================
           PAGE CONTROLS
           ======================================== */

        #pageControls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            margin-top: 30px;
        }


        .pageButton {
            padding: 10px 20px;

            border: 2px solid #555555;
            border-radius: 8px;

            background-color: #222222;
            color: #ffffff;

            font-size: 16px;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .pageButton:hover {
            background-color: #333333;
            border-color: #ffffff;
        }

        .pageButton:disabled {
            display: none;
        }


        #pageNumber {
            color: #aaaaaa;

            font-size: 16px;
        }


        /* ========================================
           BOTTOM LINE
           ======================================== */

        #bottomLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           FOOTER
           ======================================== */

        #footer {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 20px 30px;

            background-color: #151515;
        }


        #discordButton {
            padding: 8px 14px;

            border: none;
            border-radius: 6px;

            background-color: #5865F2;
            color: #ffffff;

            font-weight: bold;

            cursor: pointer;
        }


        #minecraftText {
            font-size: 16px;
        }


        #minecraftIP {
            color: #00ff00;
        }

    </style>
</head>


<body>


    <!-- ========================================
         HEADER
         ======================================== -->

    <header id="header">

        <img
            id="logo"
            src="../logo.png"
            alt="UtilitEase Logo"
        >

        <h1 id="title">
            UtilitEase
        </h1>


        <nav id="navigation">

            <a
                href="../small-text-converter/"
                class="navButton"
            >
                Small Text Converter
            </a>

            <a
                href="../unicodes/"
                class="navButton"
            >
                Unicodes
            </a>

            <a
                href="../timestamp-converter/"
                class="navButton"
            >
                Timestamp Converter
            </a>

        </nav>

    </header>


    <div id="topLine"></div>


    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main id="main">


        <!-- SEARCH -->

        <input
            type="text"
            id="searchBox"
            placeholder="Search unicodes..."
        >


        <!-- UNICODE GRID -->

        <div id="unicodeGrid"></div>


        <!-- PAGE CONTROLS -->

        <div id="pageControls">

            <button
                id="backButton"
                class="pageButton"
            >
                ← Back
            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button
                id="nextButton"
                class="pageButton"
            >
                Next →
            </button>

        </div>

    </main>


    <div id="bottomLine"></div>


    <!-- ========================================
         FOOTER
         ======================================== -->

    <footer id="footer">

        <button id="discordButton">
            Discord
        </button>

        <div id="minecraftText">

            Our Minecraft Server — SellMC!

            <span id="minecraftIP">
                <br>
                sᴇʟʟᴍᴄ.ᴍɪɴᴇʜᴜᴛ.ɢɢ
            </span>

        </div>

    </footer>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script type="module">


        /* ========================================
           UNICODES (loaded from external file)
           ======================================== */

        import { EMOJI_LIST } from "./emojis.js";

        const unicodes = EMOJI_LIST;


        /* ========================================
           ELEMENTS
           ======================================== */

        const unicodeGrid =
            document.getElementById("unicodeGrid");

        const searchBox =
            document.getElementById("searchBox");

        const backButton =
            document.getElementById("backButton");

        const nextButton =
            document.getElementById("nextButton");

        const pageNumber =
            document.getElementById("pageNumber");


        /* ========================================
           PAGE SETTINGS
           ======================================== */

        const perPage = 30;

        let currentPage = 1;

        let filteredUnicodes = unicodes;


        /* ========================================
           DISPLAY UNICODES
           ======================================== */

        function displayUnicodes() {

            unicodeGrid.innerHTML = "";


            const start =
                (currentPage - 1) * perPage;

            const end =
                start + perPage;


            const pageItems =
                filteredUnicodes.slice(start, end);


            pageItems.forEach(function(unicode) {


                const card =
                    document.createElement("div");

                card.className =
                    "unicodeCard";


                const character =
                    document.createElement("div");

                character.className =
                    "unicodeCharacter";

                character.textContent =
                    unicode.character;


                const copyButton =
                    document.createElement("button");

                copyButton.className =
                    "unicodeCopy";

                copyButton.textContent =
                    "COPY";


                copyButton.addEventListener(
                    "click",
                    async function() {

                        await navigator.clipboard.writeText(
                            unicode.character
                        );

                        copyButton.textContent =
                            "COPIED!";


                        setTimeout(
                            function() {

                                copyButton.textContent =
                                    "COPY";

                            },
                            1000
                        );

                    }
                );


                card.appendChild(character);

                card.appendChild(copyButton);

                unicodeGrid.appendChild(card);

            });


            updatePageButtons();

        }


        /* ========================================
           PAGE BUTTONS
           ======================================== */

        function updatePageButtons() {

            const totalPages =
                Math.ceil(
                    filteredUnicodes.length / perPage
                );


            pageNumber.textContent =
                "Page " + currentPage;


            backButton.disabled =
                currentPage === 1;


            nextButton.disabled =
                currentPage >= totalPages;

        }


        /* ========================================
           NEXT PAGE
           ======================================== */

        nextButton.addEventListener(
            "click",
            function() {

                const totalPages =
                    Math.ceil(
                        filteredUnicodes.length / perPage
                    );


                if (currentPage < totalPages) {

                    currentPage++;

                    displayUnicodes();

                }

            }
        );


        /* ========================================
           BACK PAGE
           ======================================== */

        backButton.addEventListener(
            "click",
            function() {

                if (currentPage > 1) {

                    currentPage--;

                    displayUnicodes();

                }

            }
        );


        /* ========================================
           SEARCH
           ======================================== */

        searchBox.addEventListener(
            "input",
            function() {

                const search =
                    searchBox.value.toLowerCase();


                filteredUnicodes =
                    unicodes.filter(
                        function(unicode) {

                            return (
                                unicode.name
                                    .toLowerCase()
                                    .includes(search)

                                ||

                                unicode.character
                                    .includes(search)
                            );

                        }
                    );


                currentPage = 1;

                displayUnicodes();

            }
        );


        /* ========================================
           INITIAL DISPLAY
           ======================================== */

        displayUnicodes();


    </script>

</body>
</html>
