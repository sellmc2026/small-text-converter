<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">

    <title>UtilitEase | Simple Online Utilities</title>

    <style>

        /* ========================================
           GENERAL PAGE
           ======================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color: #101010;
            color: #ffffff;

            font-family: Arial, sans-serif;
        }


        /* ========================================
           HEADER
           ======================================== */

        #header {
            text-align: center;

            padding-top: 30px;
            padding-bottom: 20px;
        }

        #logo {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }

        #title {
            margin-top: 10px;
            margin-bottom: 10px;

            font-size: 36px;
        }

        #subtitle {
            margin-top: 0;
            margin-bottom: 25px;

            color: #aaaaaa;

            font-size: 18px;
        }


        /* ========================================
           NAVIGATION
           ======================================== */

        #navigation {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 50px;

            padding-bottom: 20px;
        }

        .navButton {
            background: none;
            border: none;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            text-decoration: none;

            transition:
                color 0.2s ease;
        }

        .navButton:hover {
            color: #00ff00;
        }


        /* ========================================
           SEPARATOR
           ======================================== */

        #topLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           MAIN CONTENT
           ======================================== */

        #main {
            min-height: 550px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* ========================================
           TOOL GRID
           ======================================== */

        #tools {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            width: 900px;
            max-width: 90%;
        }


        /* ========================================
           TOOL CARDS
           ======================================== */

        .tool {
            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            min-height: 200px;

            padding: 25px;

            box-sizing: border-box;

            background-color: #1b1b1b;

            border: 2px solid #333333;

            border-radius: 10px;

            color: #ffffff;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .tool:hover {
            background-color: #222222;

            border-color: #00ff00;

            transform: translateY(-4px);
        }


        .toolTitle {
            margin: 0 0 10px 0;

            font-size: 24px;
        }


        .toolDescription {
            margin: 0;

            color: #aaaaaa;

            font-size: 16px;

            text-align: center;
        }


        /* ========================================
           BOTTOM LINE
           ======================================== */

        #bottomLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           FOOTER
           ======================================== */

        #footer {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 20px 30px;

            background-color: #151515;
        }


        #discordButton {
            padding: 8px 14px;

            border: none;
            border-radius: 6px;

            background-color: #5865F2;
            color: #ffffff;

            font-weight: bold;

            cursor: pointer;
        }


        #minecraftText {
            font-size: 16px;
        }


        #minecraftIP {
            color: #00ff00;
        }

    </style>
</head>


<body>


    <!-- ========================================
         HEADER
         ======================================== -->

    <header id="header">

        <img
            id="logo"
            src="logo.png"
            alt="UtilitEase Logo"
        >

        <h1 id="title">
            UtilitEase
        </h1>

        <p id="subtitle">
            Simple tools made easy
        </p>


        <!-- NAVIGATION -->

        <nav id="navigation">

            <a
                href="/utilitease/small-text-converter/"
                class="navButton"
            >
                Small Text Converter
            </a>

            <a
                href="/utilitease/unicodes/"
                class="navButton"
            >
                Unicodes
            </a>

            <a
                href="/utilitease/timestamp-converter/"
                class="navButton"
            >
                Timestamp Converter
            </a>

        </nav>

    </header>


    <div id="topLine"></div>


    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main id="main">

        <div id="tools">


            <!-- SMALL TEXT -->

            <a
                href="/utilitease/small-text-converter/"
                class="tool"
            >

                <h2 class="toolTitle">
                    Small Text
                </h2>

                <p class="toolDescription">
                    Convert normal text into small caps text
                </p>

            </a>


            <!-- UNICODES -->

            <a
                href="/utilitease/unicodes/"
                class="tool"
            >

                <h2 class="toolTitle">
                    Unicodes
                </h2>

                <p class="toolDescription">
                    Find and copy Unicode characters
                </p>

            </a>


            <!-- TIMESTAMP -->

            <a
                href="/utilitease/timestamp/"
                class="tool"
            >

                <h2 class="toolTitle">
                    Timestamp Converter
                </h2>

                <p class="toolDescription">
                    Convert timestamps into Dates and Times
                </p>

            </a>


        </div>

    </main>


    <div id="bottomLine"></div>


    <!-- ========================================
         FOOTER
         ======================================== -->

    <footer id="footer">

        <button id="discordButton">
            Discord
        </button>

        <div id="minecraftText">

            Our Minecraft Server — SellMC!

            <span id="minecraftIP">
                <br>
                sᴇʟʟᴍᴄ.ᴍɪɴᴇʜᴜᴛ.ɢɢ
            </span>

        </div>

    </footer>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script>

        const discordButton =
            document.getElementById("discordButton");


        discordButton.addEventListener(
            "click",
            function() {

                console.log(
                    "Discord button clicked."
                );

            }
        );

    </script>

</body>
</html>
