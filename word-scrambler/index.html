<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../favicon.png">

    <title>Word Scrambler | UtilitEase</title>

    <style>

        /* ========================================
           GENERAL PAGE
           ======================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color: #101010;
            color: #ffffff;

            font-family: Arial, sans-serif;
        }


        /* ========================================
           HEADER
           ======================================== */

        #header {
            text-align: center;

            padding-top: 30px;
            padding-bottom: 20px;
        }

        #logo {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }

        #title {
            margin-top: 10px;
            margin-bottom: 25px;

            font-size: 32px;
        }


        /* ========================================
           NAVIGATION
           ======================================== */

        #navigation {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 50px;

            padding-bottom: 20px;
        }

        .navButton {
            background: none;
            border: none;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .navButton:hover {
            color: #00ff00;
        }


        /* ========================================
           SEPARATOR
           ======================================== */

        #topLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           MAIN CONTENT
           ======================================== */

        #main {
            min-height: 550px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* ========================================
           CONVERTER
           ======================================== */

        #container {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;

            width: 900px;
        }


        /* ========================================
           TEXT BOXES
           ======================================== */

        #textBoxes {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;

            width: 100%;
        }


        #inputBox,
        #outputBox {
            width: 600px;
            height: 200px;

            max-length: 20;

            box-sizing: border-box;

            padding: 12px;

            font-size: 20px;
            font-family: Arial, sans-serif;

            border: 2px solid #555555;
            border-radius: 8px;

            background-color: #222222;
            color: #ffffff;

            resize: none;
        }


        #inputBox:focus,
        #outputBox:focus {
            outline: none;
        }


        /* ========================================
           GENERATE BUTTON
           ======================================== */

        #generateButton {
            width: 300px;

            box-sizing: border-box;

            padding: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background-color: #BEFF8F;
            color: #000000;

            border: 2px solid #000000;
            border-radius: 8px;

            opacity: 0.75;

            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                opacity 0.3s ease;
        }


        #generateButton:hover {
            opacity: 1;
        }


        /* ========================================
           COPY BUTTON
           ======================================== */

        #copyButton {
            width: 150px;

            box-sizing: border-box;

            padding: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background-color: #444444;
            color: #aaaaaa;

            border: 2px solid #ffffff;
            border-radius: 8px;

            opacity: 0.75;

            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                opacity 0.3s ease;
        }


        #copyButton.active {
            background-color: #8FFF3D;
            color: #ffffff;

            opacity: 1;
        }


        /* ========================================
           BOTTOM LINE
           ======================================== */

        #bottomLine {
            width: 100%;
            height: 1px;

            background-color: #444444;
        }


        /* ========================================
           FOOTER
           ======================================== */

        #footer {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 20px 30px;

            background-color: #151515;
        }


        #discordButton {
            padding: 8px 14px;

            border: none;
            border-radius: 6px;

            background-color: #5865F2;
            color: #ffffff;

            font-weight: bold;

            cursor: pointer;
        }


        #discordButton:hover {
            background-color: #ffffff;
            color: #5865F2;

            box-shadow: 0 0 15px #5865F2;
        }


        #minecraftText {
            font-size: 16px;
        }


        #minecraftIP {
            color: #00ff00;
        }

    </style>
</head>


<body>


    <!-- ========================================
         HEADER
         ======================================== -->

    <header id="header">

        <img
            id="logo"
            src="../logo.png"
            alt="Logo"
        >

        <h1 id="title">
            Small Text Converter
        </h1>


        <nav id="navigation">

            <a
                href="../"
                class="navButton"
            >
                Home
            </a>

            <a
                href="../small-text-converter/"
                class="navButton"
            >
                Small Text Converter
            </a>

            <a
                href="../unicodes/"
                class="navButton"
            >
                Unicodes
            </a>

            <a
                href="../timestamp-converter/"
                class="navButton"
            >
                Timestamp Converter
            </a>

            <a
                href="../word-scrambler/"
                class="navButton"
            >
                Word Scrambler
            </a>

        </nav>

    </header>


    <div id="topLine"></div>


    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main id="main">

        <div id="container">


            <!-- GENERATE BUTTON -->

            <button id="generateButton">
                GENERATE
            </button>


            <!-- TEXT BOXES -->

            <div id="textBoxes">

                <textarea
                    id="inputBox"
                    placeholder="Input..."
                    maxlength=40
                ></textarea>

                <textarea
                    id="outputBox"
                    readonly
                    placeholder="Scrambled text will appear here..."
                    maxlength=40
                ></textarea>

            </div>


            <!-- COPY BUTTON -->

            <button id="copyButton">
                COPY
            </button>


        </div>

    </main>


    <div id="bottomLine"></div>


    <!-- ========================================
         FOOTER
         ======================================== -->

    <footer id="footer">

        <button id="discordButton">
            Discord
        </button>

        <div id="minecraftText">

            Our Minecraft Server — SellMC!

            <span id="minecraftIP">
                <br>
                sᴇʟʟᴍᴄ.ᴍɪɴᴇʜᴜᴛ.ɢɢ
            </span>

        </div>

    </footer>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script>

        const inputBox =
            document.getElementById("inputBox");

        const outputBox =
            document.getElementById("outputBox");

        const copyButton =
            document.getElementById("copyButton");

        const generateButton =
            document.getElementById("generateButton");


        /* ========================================
           WORD SCRAMBLER
           ======================================== */

        function scrambleText(text) {

            let chars = text.split("");


            /* Fisher-Yates Shuffle */

            for (let i = chars.length - 1; i > 0; i--) {

                const j =
                    Math.floor(Math.random() * (i + 1));

                [chars[i], chars[j]] =
                    [chars[j], chars[i]];

            }


            return chars.join("");

        }


        /* ========================================
           GENERATE
           ======================================== */

        generateButton.addEventListener(
            "click",
            function() {

                if (inputBox.value.length === 0) {
                    return;
                }


                outputBox.value =
                    scrambleText(inputBox.value);


                copyButton.classList.add(
                    "active"
                );

            }
        );


        /* ========================================
           INPUT
           ======================================== */

        inputBox.addEventListener(
            "input",
            function() {

                if (inputBox.value.length > 0) {

                    copyButton.classList.remove(
                        "active"
                    );

                } else {

                    outputBox.value = "";

                    copyButton.classList.remove(
                        "active"
                    );

                }

            }
        );


        /* ========================================
           COPY
           ======================================== */

        copyButton.addEventListener(
            "click",
            async function() {

                if (outputBox.value.length === 0) {
                    return;
                }


                await navigator.clipboard.writeText(
                    outputBox.value
                );


                copyButton.textContent =
                    "COPIED!";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";

                    },
                    1000
                );

            }
        );


        /* ========================================
           DISCORD
           ======================================== */

        const discordButton =
            document.getElementById("discordButton");


        discordButton.addEventListener(
            "click",
            function() {

                console.log(
                    "Discord button clicked."
                );

            }
        );

    </script>

</body>
</html>
